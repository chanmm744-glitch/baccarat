<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百家樂分區算牌輔助儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-5 font-sans select-none">
    <div class="max-w-4xl mx-auto space-y-4">
        
        <!-- 頂部資訊與控制 -->
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
            <div>
                <h1 class="text-base font-bold text-emerald-400">百家樂雙區精確算牌器</h1>
                <p class="text-xs text-slate-400">剩餘張數：<span id="total-cards" class="text-emerald-300 font-mono font-bold">416</span> / 416 (8副牌)</p>
            </div>
            <div class="flex gap-2">
                <button onclick="undoLastCard()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-semibold rounded-lg border border-slate-700 transition">
                    ↩ 撤銷上一張
                </button>
                <button onclick="resetShoe()" class="px-3 py-1.5 bg-rose-900/80 hover:bg-rose-800 active:scale-95 text-xs font-semibold rounded-lg border border-rose-700 transition">
                    洗牌重置
                </button>
            </div>
        </div>

        <!-- 動態 AI 訊號提示 -->
        <div id="signal-box" class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center transition-all">
            <span class="text-xs text-slate-400 block mb-1">機率模型動態建議</span>
            <div id="signal-text" class="text-base font-bold text-slate-300">請依據開牌點擊「閒家」或「莊家」的牌面...</div>
        </div>

        <!-- 分區輸入面板：左閒 (藍) / 右莊 (紅) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- 閒家輸入區 -->
            <div class="bg-slate-900/90 p-4 rounded-xl border-2 border-blue-900/80 space-y-3">
                <div class="flex justify-between items-center border-b border-blue-900/50 pb-2">
                    <h2 class="text-sm font-bold text-blue-400 flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> 閒家 (Player) 點選區
                    </h2>
                    <span id="p-hand-display" class="text-xs font-mono text-blue-300 bg-blue-950 px-2 py-0.5 rounded border border-blue-800">當局: 無</span>
                </div>
                <div class="grid grid-cols-5 gap-1.5">
                    <script>
                        const pCards = [
                            {label: 'A', val: 1}, {label: '2', val: 2}, {label: '3', val: 3}, {label: '4', val: 4}, {label: '5', val: 5},
                            {label: '6', val: 6}, {label: '7', val: 7}, {label: '8', val: 8}, {label: '9', val: 9}, {label: '10/J/Q/K', val: 0}
                        ];
                        pCards.forEach(c => {
                            document.write(`
                                <button onclick="inputCard(${c.val}, 'P')" class="h-14 bg-slate-800/90 hover:bg-blue-600 active:scale-95 text-white font-bold rounded-lg border border-slate-700 transition flex flex-col items-center justify-center">
                                    <span class="text-sm">${c.label}</span>
                                </button>
                            `);
                        });
                    </script>
                </div>
            </div>

            <!-- 莊家輸入區 -->
            <div class="bg-slate-900/90 p-4 rounded-xl border-2 border-rose-900/80 space-y-3">
                <div class="flex justify-between items-center border-b border-rose-900/50 pb-2">
                    <h2 class="text-sm font-bold text-rose-400 flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span> 莊家 (Banker) 點選區
                    </h2>
                    <span id="b-hand-display" class="text-xs font-mono text-rose-300 bg-rose-950 px-2 py-0.5 rounded border border-rose-800">當局: 無</span>
                </div>
                <div class="grid grid-cols-5 gap-1.5">
                    <script>
                        pCards.forEach(c => {
                            document.write(`
                                <button onclick="inputCard(${c.val}, 'B')" class="h-14 bg-slate-800/90 hover:bg-rose-600 active:scale-95 text-white font-bold rounded-lg border border-slate-700 transition flex flex-col items-center justify-center">
                                    <span class="text-sm">${c.label}</span>
                                </button>
                            `);
                        });
                    </script>
                </div>
            </div>

        </div>

        <!-- 即時機率與剩餘牌數點數面板 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            
            <!-- 勝率與 EV -->
            <div class="md:col-span-2 bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">即時勝率與期望值 (EV)</h2>
                <div class="grid grid-cols-3 gap-2">
                    <div class="p-3 bg-slate-950/80 rounded-lg border border-slate-800 text-center">
                        <div class="text-xs text-rose-400 font-bold mb-1">莊家 (Banker)</div>
                        <div id="prob-b" class="text-sm font-bold font-mono text-slate-200">45.86%</div>
                        <div id="ev-b" class="text-xs font-mono text-slate-500 mt-1">EV: -1.06%</div>
                    </div>
                    <div class="p-3 bg-slate-950/80 rounded-lg border border-slate-800 text-center">
                        <div class="text-xs text-blue-400 font-bold mb-1">閒家 (Player)</div>
                        <div id="prob-p" class="text-sm font-bold font-mono text-slate-200">44.62%</div>
                        <div id="ev-p" class="text-xs font-mono text-slate-500 mt-1">EV: -1.24%</div>
                    </div>
                    <div class="p-3 bg-slate-950/80 rounded-lg border border-slate-800 text-center">
                        <div class="text-xs text-emerald-400 font-bold mb-1">和局 (Tie)</div>
                        <div id="prob-t" class="text-sm font-bold font-mono text-slate-200">9.52%</div>
                        <div id="ev-t" class="text-xs font-mono text-slate-500 mt-1">EV: -14.36%</div>
                    </div>
                </div>
            </div>

            <!-- 牌堆剩餘張數預覽 -->
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">牌堆點數剩餘</h2>
                <div id="deck-status" class="grid grid-cols-5 gap-1 text-[11px] font-mono text-center">
                    <!-- 由 JS 動態生成 -->
                </div>
            </div>

        </div>

        <!-- 歷史出牌紀錄 -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
            <h2 class="text-xs font-bold text-slate-400 mb-2">出牌歷史序列 (最近在上)：</h2>
            <div id="history-container" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto text-xs font-mono">
                <span class="text-slate-600 italic">尚無資料</span>
            </div>
        </div>

    </div>

    <script>
        const INITIAL_DECK = { 1: 32, 2: 32, 3: 32, 4: 32, 5: 32, 6: 32, 7: 32, 8: 32, 9: 32, 0: 128 };
        let deck = { ...INITIAL_DECK };
        let totalCards = 416;
        let cardHistory = []; // { val, target: 'B'|'P' }

        function inputCard(val, target) {
            if (deck[val] <= 0) return alert('該點數牌已用盡！');
            deck[val]--;
            totalCards--;
            cardHistory.push({ val, target });
            updateDashboard();
        }

        function undoLastCard() {
            if (cardHistory.length === 0) return;
            const last = cardHistory.pop();
            deck[last.val]++;
            totalCards++;
            updateDashboard();
        }

        function resetShoe() {
            if (!confirm('確定要洗牌並重置當前牌靴嗎？')) return;
            deck = { ...INITIAL_DECK };
            totalCards = 416;
            cardHistory = [];
            updateDashboard();
        }

        function updateDashboard() {
            document.getElementById('total-cards').innerText = totalCards;

            // 更新當前手牌顯示（最近各 3 張）
            const bCards = cardHistory.filter(x => x.target === 'B').slice(-3).map(x => x.val === 0 ? 'K' : x.val);
            const pCards = cardHistory.filter(x => x.target === 'P').slice(-3).map(x => x.val === 0 ? 'K' : x.val);
            document.getElementById('b-hand-display').innerText = `當前: ${bCards.length > 0 ? bCards.join(' ') : '無'}`;
            document.getElementById('p-hand-display').innerText = `當前: ${pCards.length > 0 ? pCards.join(' ') : '無'}`;

            // 更新剩餘張數面板
            const statusEl = document.getElementById('deck-status');
            statusEl.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                statusEl.innerHTML += `<div class="bg-slate-950 p-1 rounded border border-slate-800"><span class="text-slate-500">${i}:</span> <span class="text-emerald-400 font-bold">${deck[i]}</span></div>`;
            }
            statusEl.innerHTML += `<div class="bg-slate-950 p-1 rounded border border-slate-800"><span class="text-slate-500">10/K:</span> <span class="text-emerald-400 font-bold">${deck[0]}</span></div>`;

            // 更新歷史序列
            const histEl = document.getElementById('history-container');
            if (cardHistory.length === 0) {
                histEl.innerHTML = '<span class="text-slate-600 italic">尚無資料</span>';
            } else {
                histEl.innerHTML = cardHistory.map(item => {
                    const color = item.target === 'B' ? 'text-rose-400 border-rose-900/60 bg-rose-950/40' : 'text-blue-400 border-blue-900/60 bg-blue-950/40';
                    const tag = item.target === 'B' ? '莊' : '閒';
                    const label = item.val === 0 ? 'K' : item.val;
                    return `<span class="px-2 py-0.5 border rounded ${color}">${tag}:${label}</span>`;
                }).join('');
            }

            calculateProbabilities();
        }

        function calculateProbabilities() {
            if (totalCards < 30) {
                document.getElementById('signal-text').innerText = '牌靴即將結束，建議停止下注';
                return;
            }

            const pLow = (deck[1] + deck[2] + deck[3] + deck[4]) / totalCards;
            const pHigh = (deck[5] + deck[6] + deck[7] + deck[8] + deck[9]) / totalCards;

            const baseProbB = 0.4586 + (pLow - 0.3077) * 0.22 - (pHigh - 0.3846) * 0.08;
            const baseProbP = 0.4462 + (pHigh - 0.3846) * 0.20 - (pLow - 0.3077) * 0.05;
            const baseProbT = 1 - baseProbB - baseProbP;

            const evB = (baseProbB * 0.95) - (1 - baseProbB - baseProbT);
            const evP = (baseProbP * 1.0) - (1 - baseProbP - baseProbT);
            const evT = (baseProbT * 8.0) - (1 - baseProbT);

            document.getElementById('prob-b').innerText = (baseProbB * 100).toFixed(2) + '%';
            document.getElementById('prob-p').innerText = (baseProbP * 100).toFixed(2) + '%';
            document.getElementById('prob-t').innerText = (baseProbT * 100).toFixed(2) + '%';

            updateEVDisplay('ev-b', evB);
            updateEVDisplay('ev-p', evP);
            updateEVDisplay('ev-t', evT);

            const signalBox = document.getElementById('signal-box');
            const signalText = document.getElementById('signal-text');

            if (evB > 0) {
                signalBox.className = "bg-rose-950/80 border-2 border-rose-500 p-4 rounded-xl text-center shadow-lg shadow-rose-950/50";
                signalText.innerHTML = `<span class="text-rose-400 font-extrabold text-lg">🔥 觸發優勢訊號：推薦下注【莊家】(EV: +${(evB * 100).toFixed(2)}%)</span>`;
            } else if (evP > 0) {
                signalBox.className = "bg-blue-950/80 border-2 border-blue-500 p-4 rounded-xl text-center shadow-lg shadow-blue-950/50";
                signalText.innerHTML = `<span class="text-blue-400 font-extrabold text-lg">🔥 觸發優勢訊號：推薦下注【閒家】(EV: +${(evP * 100).toFixed(2)}%)</span>`;
            } else if (evT > 0) {
                signalBox.className = "bg-emerald-950/80 border-2 border-emerald-500 p-4 rounded-xl text-center shadow-lg shadow-emerald-950/50";
                signalText.innerHTML = `<span class="text-emerald-400 font-extrabold text-lg">⚡ 高機率和局警示：推薦觀望或小注【和局】(EV: +${(evT * 100).toFixed(2)}%)</span>`;
            } else {
                signalBox.className = "bg-slate-900 p-4 rounded-xl border border-slate-800 text-center";
                signalText.innerText = `當前無正 EV 下注點，建議觀望或順應路勢`;
            }
        }

        function updateEVDisplay(id, evVal) {
            const el = document.getElementById(id);
            const valStr = (evVal * 100).toFixed(2) + '%';
            if (evVal > 0) {
                el.innerText = `EV: +${valStr}`;
                el.className = "text-xs font-mono font-bold text-emerald-400";
            } else {
                el.innerText = `EV: ${valStr}`;
                el.className = "text-xs font-mono text-slate-500";
            }
        }

        updateDashboard();
    </script>
</body>
</html>
