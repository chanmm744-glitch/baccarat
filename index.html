<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百家樂 13 軌動態算牌戰術板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --banker-red: #ef4444;
            --player-blue: #3b82f6;
            --tie-green: #10b981;
            --pair-gold: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 頂部動態訊號欄 */
        .signal-box {
            background-color: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        /* 數據看板 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .card-title {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .card-value {
            font-size: 18px;
            font-weight: bold;
        }

        /* 13 軌牌庫面板 */
        .deck-status {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 10px;
        }

        .deck-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            font-size: 12px;
            margin-top: 6px;
        }

        .deck-item {
            background: #334155;
            padding: 4px 2px;
            border-radius: 4px;
        }

        .deck-item div:first-child {
            color: var(--text-sub);
            font-size: 10px;
        }

        /* 輸入按鈕區 */
        .input-section {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .btn-card {
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 10px 0;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-card:active {
            background-color: #475569;
            transform: scale(0.95);
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-action {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-submit { background-color: var(--player-blue); color: white; }
        .btn-reset { background-color: #ef4444; color: white; }

        /* 本局暫存點數顯示 */
        .current-hand {
            display: flex;
            justify-content: space-between;
            background: #020617;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部動態訊號 -->
    <div id="signal-box" class="signal-box">
        <div id="signal-text" style="color: var(--text-sub);">請開始輸入開牌數據...</div>
    </div>

    <!-- 數據分析看板 -->
    <div class="dashboard">
        <div class="card">
            <div class="card-title">莊家機率 / EV</div>
            <div id="val-b" class="card-value" style="color: var(--banker-red);">45.86%</div>
            <div id="ev-b" style="font-size:11px; color:var(--text-sub);">EV: -1.06%</div>
        </div>
        <div class="card">
            <div class="card-title">閒家機率 / EV</div>
            <div id="val-p" class="card-value" style="color: var(--player-blue);">44.62%</div>
            <div id="ev-p" style="font-size:11px; color:var(--text-sub);">EV: -1.24%</div>
        </div>
        <div class="card">
            <div class="card-title">對子機率 / EV (莊對/閒對)</div>
            <div id="val-pair" class="card-value" style="color: var(--pair-gold);">7.47%</div>
            <div id="ev-pair" style="font-size:11px; color:var(--text-sub);">EV: -10.36%</div>
        </div>
        <div class="card">
            <div class="card-title">和局機率 / EV</div>
            <div id="val-t" class="card-value" style="color: var(--tie-green);">9.52%</div>
            <div id="ev-t" style="font-size:11px; color:var(--text-sub);">EV: -14.36%</div>
        </div>
    </div>

    <!-- 13 軌剩餘牌庫監控 -->
    <div class="deck-status">
        <div style="display:flex; justify-size:space-between; font-size:12px; color:var(--text-sub);">
            <span>13 軌牌庫剩餘監控</span>
            <span id="total-cards">剩餘：416 / 416 張 (100%)</span>
        </div>
        <div class="deck-grid" id="deck-display"></div>
    </div>

    <!-- 點數輸入區 -->
    <div class="input-section">
        <div class="current-hand">
            <span>本局輸入：<span id="temp-cards" style="color: var(--pair-gold);">無</span></span>
            <span id="temp-count">已選 0 張</span>
        </div>
        <div class="btn-grid">
            <button class="btn-card" onclick="addCard('A')">A</button>
            <button class="btn-card" onclick="addCard('2')">2</button>
            <button class="btn-card" onclick="addCard('3')">3</button>
            <button class="btn-card" onclick="addCard('4')">4</button>
            <button class="btn-card" onclick="addCard('5')">5</button>
            <button class="btn-card" onclick="addCard('6')">6</button>
            <button class="btn-card" onclick="addCard('7')">7</button>
            <button class="btn-card" onclick="addCard('8')">8</button>
            <button class="btn-card" onclick="addCard('9')">9</button>
            <button class="btn-card" onclick="addCard('10')">10</button>
            <button class="btn-card" onclick="addCard('J')">J</button>
            <button class="btn-card" onclick="addCard('Q')">Q</button>
            <button class="btn-card" onclick="addCard('K')">K</button>
            <button class="btn-card" style="background:#dc2626;" onclick="popCard()">⌫</button>
        </div>
        <div class="action-btns">
            <button class="btn-action btn-submit" onclick="submitHand()">完成本局並結算</button>
            <button class="btn-action btn-reset" onclick="resetShoe()">重置新牌靴 (8副)</button>
        </div>
    </div>
</div>

<script>
    // 初始 8 副牌 13 軌狀態
    const INITIAL_DECK = {
        'A': 32, '2': 32, '3': 32, '4': 32, '5': 32,
        '6': 32, '7': 32, '8': 32, '9': 32, '10': 32,
        'J': 32, 'Q': 32, 'K': 32
    };

    let deck13 = { ...INITIAL_DECK };
    let tempHand = [];

    // 初始化顯示
    updateDeckUI();

    function addCard(rank) {
        if (tempHand.length >= 6) return;
        if (deck13[rank] <= 0) {
            alert(`牌庫中已無點數 ${rank}`);
            return;
        }
        tempHand.push(rank);
        deck13[rank]--;
        updateTempUI();
        updateDeckUI();
    }

    function popCard() {
        if (tempHand.length === 0) return;
        let last = tempHand.pop();
        deck13[last]++;
        updateTempUI();
        updateDeckUI();
    }

    function updateTempUI() {
        document.getElementById('temp-cards').innerText = tempHand.length > 0 ? tempHand.join(', ') : '無';
        document.getElementById('temp-count').innerText = `已選 ${tempHand.length} 張`;
    }

    function submitHand() {
        if (tempHand.length < 4) {
            alert('一局百家樂至少需輸入 4 張牌（閒家 2 張、莊家 2 張）');
            return;
        }
        tempHand = [];
        updateTempUI();
        calculateAdvancedEV();
    }

    function resetShoe() {
        if (confirm('確定要重置為 8 副新牌靴嗎？')) {
            deck13 = { ...INITIAL_DECK };
            tempHand = [];
            updateTempUI();
            updateDeckUI();
            calculateAdvancedEV();
        }
    }

    function updateDeckUI() {
        const grid = document.getElementById('deck-display');
        grid.innerHTML = '';
        let total = 0;
        for (let rank in deck13) {
            total += deck13[rank];
            grid.innerHTML += `
                <div class="deck-item">
                    <div>${rank}</div>
                    <div style="font-weight:bold;">${deck13[rank]}</div>
                </div>
            `;
        }
        let percent = ((total / 416) * 100).toFixed(1);
        document.getElementById('total-cards').innerText = `剩餘：${total} / 416 張 (${percent}%)`;
    }

    function calculateAdvancedEV() {
        let N = 0;
        for (let rank in deck13) { N += deck13[rank]; }

        if (N < 14) {
            document.getElementById('signal-text').innerText = '牌靴已枯竭（剩餘 < 14 張），建議停止下注';
            return;
        }

        // 1. 精確計算對子概率與 EV
        let pairCombos = 0;
        for (let rank in deck13) {
            let c = deck13[rank];
            pairCombos += c * (c - 1);
        }
        const pPair = pairCombos / (N * (N - 1));
        const evPair = (12 * pPair) - 1; // 11賠1 (回報 12 倍)

        // 2. 轉換點數矩陣計算莊/閒/和 EV
        let c0 = deck13['10'] + deck13['J'] + deck13['Q'] + deck13['K'];
        let d = {
            0: c0, 1: deck13['A'], 2: deck13['2'], 3: deck13['3'], 4: deck13['4'],
            5: deck13['5'], 6: deck13['6'], 7: deck13['7'], 8: deck13['8'], 9: deck13['9']
        };

        const wB = { 1:0.00015, 2:0.00028, 3:0.00042, 4:0.00065, 5:-0.00018, 6:-0.00041, 7:-0.00052, 8:-0.00035, 9:-0.00012, 0:0.00008 };
        const wP = { 1:-0.00012, 2:-0.00025, 3:-0.00038, 4:-0.00058, 5:0.00051, 6:0.00072, 7:0.00081, 8:0.00053, 9:0.00025, 0:-0.00015 };

        let bShift = 0, pShift = 0;
        for (let v = 0; v <= 9; v++) {
            let initRatio = (v === 0) ? (128 / 416) : (32 / 416);
            let diff = (d[v] / N) - initRatio;
            bShift += diff * wB[v] * 100;
            pShift += diff * wP[v] * 100;
        }

        const pB = 0.458597 + bShift;
        const pP = 0.446247 + pShift;
        const pT = 1.0 - pB - pP;

        const evB = (pB * 0.95) - (1 - pB - pT);
        const evP = (pP * 1.0) - (1 - pP - pT);
        const evT = (pT * 8.0) - (1 - pT);

        // UI 數值渲染
        document.getElementById('val-b').innerText = (pB * 100).toFixed(2) + '%';
        document.getElementById('val-p').innerText = (pP * 100).toFixed(2) + '%';
        document.getElementById('val-pair').innerText = (pPair * 100).toFixed(2) + '%';
        document.getElementById('val-t').innerText = (pT * 100).toFixed(2) + '%';

        document.getElementById('ev-b').innerText = `EV: ${(evB * 100).toFixed(2)}%`;
        document.getElementById('ev-p').innerText = `EV: ${(evP * 100).toFixed(2)}%`;
        document.getElementById('ev-pair').innerText = `EV: ${(evPair * 100).toFixed(2)}%`;
        document.getElementById('ev-t').innerText = `EV: ${(evT * 100).toFixed(2)}%`;

        // 3. 安全門檻過濾機制
        const T_MAIN = 0.0025; // 主注 EV > +0.25%
        const T_PAIR = 0.0120; // 對子 EV > +1.20%
        const T_TIE  = 0.0200; // 和局 EV > +2.00%

        let signals = [];
        let boxColor = '#334155';

        if (evPair > T_PAIR) {
            signals.push(`<span style="color:#f59e0b;">🔥 對子觸發正 EV：下注【莊對 & 閒對】</span>`);
            boxColor = '#f59e0b';
        }
        if (evB > T_MAIN) {
            signals.push(`<span style="color:#f87171;">🔴 主注推薦【莊家】</span>`);
            boxColor = '#ef4444';
        } else if (evP > T_MAIN) {
            signals.push(`<span style="color:#60a5fa;">🔵 主注推薦【閒家】</span>`);
            boxColor = '#3b82f6';
        }
        if (evT > T_TIE) {
            signals.push(`<span style="color:#34d399;">🟢 旁注推薦【和局】</span>`);
        }

        const signalBox = document.getElementById('signal-box');
        const signalText = document.getElementById('signal-text');

        signalBox.style.borderColor = boxColor;
        if (signals.length > 0) {
            signalText.innerHTML = signals.join(' | ');
        } else {
            signalText.innerText = `剩餘 ${N} 張 | 當前未達安全下注門檻，建議觀望`;
        }
    }
</script>

</body>
</html>
