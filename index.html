<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百家樂個人實時戰術板</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 16px; user-select: none; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        
        /* 卡片通用樣式 */
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        
        /* 頂部列 */
        .header { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 18px; font-weight: bold; color: #34d399; }
        .subtitle { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .btn-group { display: flex; gap: 8px; }
        
        /* 按鈕樣式 */
        .btn { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
        .btn-undo { background-color: #334155; color: #f8fafc; border-color: #475569; }
        .btn-undo:hover { background-color: #475569; }
        .btn-reset { background-color: #881337; color: #fecdd3; border-color: #9f1239; }
        .btn-reset:hover { background-color: #9f1239; }
        
        /* 提示框 */
        .signal-box { text-align: center; }
        .signal-label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        .signal-text { font-size: 16px; font-weight: bold; color: #cbd5e1; }
        
        /* 雙區按鈕版面 */
        .zones-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 640px) { .zones-grid { grid-template-columns: 1fr; } }
        
        .zone-player { border: 2px solid #1e3a8a; background-color: rgba(15, 23, 42, 0.6); }
        .zone-banker { border: 2px solid #831843; background-color: rgba(15, 23, 42, 0.6); }
        .zone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #334155; }
        .zone-title-p { color: #60a5fa; font-size: 14px; font-weight: bold; }
        .zone-title-b { color: #f87171; font-size: 14px; font-weight: bold; }
        
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .card-btn { height: 50px; background-color: #334155; color: #ffffff; border: 1px solid #475569; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .card-btn:active { transform: scale(0.95); }
        .card-btn-p:hover { background-color: #2563eb; }
        .card-btn-b:hover { background-color: #dc2626; }
        
        /* 機率面板 */
        .prob-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .prob-card { background-color: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; text-align: center; }
        .prob-val { font-size: 14px; font-weight: bold; font-family: monospace; color: #e2e8f0; margin: 4px 0; }
        .ev-val { font-size: 11px; font-family: monospace; color: #64748b; }
        
        /* 歷史記錄 */
        .history-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 90px; overflow-y: auto; font-size: 12px; font-family: monospace; margin-top: 8px; }
        .tag { padding: 2px 8px; border-radius: 4px; border: 1px solid transparent; }
        .tag-b { background-color: rgba(136, 19, 55, 0.4); color: #f87171; border-color: #9f1239; }
        .tag-p { background-color: rgba(30, 58, 138, 0.4); color: #60a5fa; border-color: #1e40af; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 頂部資訊列 -->
        <div class="card header">
            <div>
                <div class="title">百家樂實時雙區算牌板</div>
                <div class="subtitle">剩餘張數：<span id="total-cards" style="color:#6ee7b7; font-family:monospace; font-weight:bold;">416</span> / 416 (8副牌)</div>
            </div>
            <div class="btn-group">
                <button onclick="undoLastCard()" class="btn btn-undo">↩ 撤銷</button>
                <button onclick="resetShoe()" class="btn btn-reset">洗牌重置</button>
            </div>
        </div>

        <!-- AI 訊號提示 -->
        <div id="signal-box" class="card signal-box">
            <span class="signal-label">算牌模型動態建議</span>
            <div id="signal-text" class="signal-text">請依據開牌點擊「閒家」或「莊家」的牌面...</div>
        </div>

        <!-- 閒家/莊家 分區點選 -->
        <div class="zones-grid">
            <!-- 閒家區 -->
            <div class="card zone-player">
                <div class="zone-header">
                    <span class="zone-title-p">🔵 閒家 (Player)</span>
                    <span id="p-hand-display" style="font-size:12px; color:#93c5fd; font-family:monospace;">當前: 無</span>
                </div>
                <div class="card-grid">
                    <button class="card-btn card-btn-p" onclick="inputCard(1, 'P')">A</button>
                    <button class="card-btn card-btn-p" onclick="inputCard(2, 'P')">2</button>
                    <button class="card-btn card-btn-p" onclick="inputCard(3, 'P')">3</button>
                    <button class="card-btn card-btn-p" onclick="inputCard(4, 'P')">4</button>
                    <button class="card-btn card-btn-p" onclick="inputCard(5, 'P')">5</button>
                    <button class="card-btn card-btn-p" onclick="inputCard(6, 'P')">6</button>
                    <button class="card-btn card-btn-p" onclick="inputCard(7, 'P')">7</button>
                    <button class="card-btn card-btn-p" onclick="inputCard(8, 'P')">8</button>
                    <button class="card-btn card-btn-p" onclick="inputCard(9, 'P')">9</button>
                    <button class="card-btn card-btn-p" onclick="inputCard(0, 'P')">10/K</button>
                </div>
            </div>

            <!-- 莊家區 -->
            <div class="card zone-banker">
                <div class="zone-header">
                    <span class="zone-title-b">🔴 莊家 (Banker)</span>
                    <span id="b-hand-display" style="font-size:12px; color:#fca5a5; font-family:monospace;">當前: 無</span>
                </div>
                <div class="card-grid">
                    <button class="card-btn card-btn-b" onclick="inputCard(1, 'B')">A</button>
                    <button class="card-btn card-btn-b" onclick="inputCard(2, 'B')">2</button>
                    <button class="card-btn card-btn-b" onclick="inputCard(3, 'B')">3</button>
                    <button class="card-btn card-btn-b" onclick="inputCard(4, 'B')">4</button>
                    <button class="card-btn card-btn-b" onclick="inputCard(5, 'B')">5</button>
                    <button class="card-btn card-btn-b" onclick="inputCard(6, 'B')">6</button>
                    <button class="card-btn card-btn-b" onclick="inputCard(7, 'B')">7</button>
                    <button class="card-btn card-btn-b" onclick="inputCard(8, 'B')">8</button>
                    <button class="card-btn card-btn-b" onclick="inputCard(9, 'B')">9</button>
                    <button class="card-btn card-btn-b" onclick="inputCard(0, 'B')">10/K</button>
                </div>
            </div>
        </div>

        <!-- 勝率與 EV 面板 -->
        <div class="card">
            <div style="font-size:12px; font-weight:bold; color:#94a3b8; text-transform:uppercase;">即時勝率與期望值 (EV)</div>
            <div class="prob-grid">
                <div class="prob-card">
                    <div style="font-size:12px; color:#f87171; font-weight:bold;">莊家 (Banker)</div>
                    <div id="prob-b" class="prob-val">45.86%</div>
                    <div id="ev-b" class="ev-val">EV: -1.06%</div>
                </div>
                <div class="prob-card">
                    <div style="font-size:12px; color:#60a5fa; font-weight:bold;">閒家 (Player)</div>
                    <div id="prob-p" class="prob-val">44.62%</div>
                    <div id="ev-p" class="ev-val">EV: -1.24%</div>
                </div>
                <div class="prob-card">
                    <div style="font-size:12px; color:#34d399; font-weight:bold;">和局 (Tie)</div>
                    <div id="prob-t" class="prob-val">9.52%</div>
                    <div id="ev-t" class="ev-val">EV: -14.36%</div>
                </div>
            </div>
        </div>

        <!-- 歷史紀錄 -->
        <div class="card">
            <div style="font-size:12px; font-weight:bold; color:#94a3b8;">出牌歷史記錄序列：</div>
            <div id="history-container" class="history-list">
                <span style="color:#64748b; font-style:italic;">尚無資料</span>
            </div>
        </div>

    </div>

    <script>
        const INITIAL_DECK = { 1: 32, 2: 32, 3: 32, 4: 32, 5: 32, 6: 32, 7: 32, 8: 32, 9: 32, 0: 128 };
        let deck = { ...INITIAL_DECK };
        let totalCards = 416;
        let cardHistory = [];

        function inputCard(val, target) {
            if (deck[val] <= 0) return alert('該點數牌已用盡！');
            deck[val]--;
            totalCards--;
            cardHistory.push({ val, target });
            updateDashboard();
        }

        function undoLastCard() {
            if (cardHistory.length === 0) return;
            const last = cardHistory.pop();
            deck[last.val]++;
            totalCards++;
            updateDashboard();
        }

        function resetShoe() {
            if (!confirm('確定要洗牌並重置當前牌靴嗎？')) return;
            deck = { ...INITIAL_DECK };
            totalCards = 416;
            cardHistory = [];
            updateDashboard();
        }

        function updateDashboard() {
            document.getElementById('total-cards').innerText = totalCards;

            const bCards = cardHistory.filter(x => x.target === 'B').slice(-3).map(x => x.val === 0 ? 'K' : x.val);
            const pCards = cardHistory.filter(x => x.target === 'P').slice(-3).map(x => x.val === 0 ? 'K' : x.val);
            document.getElementById('b-hand-display').innerText = `當前: ${bCards.length > 0 ? bCards.join(' ') : '無'}`;
            document.getElementById('p-hand-display').innerText = `當前: ${pCards.length > 0 ? pCards.join(' ') : '無'}`;

            const histEl = document.getElementById('history-container');
            if (cardHistory.length === 0) {
                histEl.innerHTML = '<span style="color:#64748b; font-style:italic;">尚無資料</span>';
            } else {
                histEl.innerHTML = cardHistory.map(item => {
                    const tagClass = item.target === 'B' ? 'tag-b' : 'tag-p';
                    const tagText = item.target === 'B' ? '莊' : '閒';
                    const label = item.val === 0 ? '10/K' : item.val;
                    return `<span class="tag ${tagClass}">${tagText}:${label}</span>`;
                }).join('');
            }

            calculateProbabilities();
        }

        function calculateProbabilities() {
            if (totalCards < 30) {
                document.getElementById('signal-text').innerText = '牌靴即將結束，建議停止下注';
                return;
            }

            const pLow = (deck[1] + deck[2] + deck[3] + deck[4]) / totalCards;
            const pHigh = (deck[5] + deck[6] + deck[7] + deck[8] + deck[9]) / totalCards;

            const baseProbB = 0.4586 + (pLow - 0.3077) * 0.22 - (pHigh - 0.3846) * 0.08;
            const baseProbP = 0.4462 + (pHigh - 0.3846) * 0.20 - (pLow - 0.3077) * 0.05;
            const baseProbT = 1 - baseProbB - baseProbP;

            const evB = (baseProbB * 0.95) - (1 - baseProbB - baseProbT);
            const evP = (baseProbP * 1.0) - (1 - baseProbP - baseProbT);
            const evT = (baseProbT * 8.0) - (1 - baseProbT);

            document.getElementById('prob-b').innerText = (baseProbB * 100).toFixed(2) + '%';
            document.getElementById('prob-p').innerText = (baseProbP * 100).toFixed(2) + '%';
            document.getElementById('prob-t').innerText = (baseProbT * 100).toFixed(2) + '%';

            updateEVDisplay('ev-b', evB);
            updateEVDisplay('ev-p', evP);
            updateEVDisplay('ev-t', evT);

            const signalBox = document.getElementById('signal-box');
            const signalText = document.getElementById('signal-text');

            if (evB > 0) {
                signalBox.style.borderColor = '#ef4444';
                signalBox.style.backgroundColor = 'rgba(153, 27, 27, 0.6)';
                signalText.innerHTML = `<span style="color:#f87171; font-size:18px;">🔥 觸發優勢訊號：推薦下注【莊家】(EV: +${(evB * 100).toFixed(2)}%)</span>`;
            } else if (evP > 0) {
                signalBox.style.borderColor = '#3b82f6';
                signalBox.style.backgroundColor = 'rgba(30, 64, 175, 0.6)';
                signalText.innerHTML = `<span style="color:#60a5fa; font-size:18px;">🔥 觸發優勢訊號：推薦下注【閒家】(EV: +${(evP * 100).toFixed(2)}%)</span>`;
            } else if (evT > 0) {
                signalBox.style.borderColor = '#10b981';
                signalBox.style.backgroundColor = 'rgba(6, 78, 59, 0.6)';
                signalText.innerHTML = `<span style="color:#34d399; font-size:18px;">⚡ 高機率和局警示：推薦觀望或小注【和局】(EV: +${(evT * 100).toFixed(2)}%)</span>`;
            } else {
                signalBox.style.borderColor = '#334155';
                signalBox.style.backgroundColor = '#1e293b';
                signalText.innerText = `當前無正 EV 下注點，建議觀望或順應路勢`;
            }
        }

        function updateEVDisplay(id, evVal) {
            const el = document.getElementById(id);
            const valStr = (evVal * 100).toFixed(2) + '%';
            if (evVal > 0) {
                el.innerText = `EV: +${valStr}`;
                el.style.color = '#34d399';
                el.style.fontWeight = 'bold';
            } else {
                el.innerText = `EV: ${valStr}`;
                el.style.color = '#64748b';
            }
        }

        updateDashboard();
    </script>
</body>
</html>
