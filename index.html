<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百家樂個人輔助分析儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans select-none">
    <div class="max-w-5xl mx-auto space-y-4">
        
        <!-- 頂部資訊欄 -->
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
            <div>
                <h1 class="text-lg font-bold text-emerald-400">百家樂個人實時戰術板</h1>
                <p class="text-xs text-slate-400">當前剩餘張數：<span id="total-cards" class="text-emerald-300 font-mono font-bold">416</span> / 416 (8副牌)</p>
            </div>
            <div class="flex gap-2">
                <button onclick="undoLastCard()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition">
                    ↩ 撤銷上一張
                </button>
                <button onclick="resetShoe()" class="px-3 py-1.5 bg-rose-900/80 hover:bg-rose-800 text-xs font-semibold rounded-lg border border-rose-700 transition">
                    洗牌重置
                </button>
            </div>
        </div>

        <!-- 訊號提示框 -->
        <div id="signal-box" class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center transition-all">
            <span class="text-xs text-slate-400 block mb-1">AI 算牌模型動態建議</span>
            <div id="signal-text" class="text-base font-bold text-slate-300">資料蒐集期：請繼續輸入牌面...</div>
        </div>

        <!-- 主操作面板與機率面板 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            
            <!-- 手動點擊快選區 -->
            <div class="lg:col-span-2 bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-4">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">點擊下方按鈕錄入開出牌面</h2>
                <div class="grid grid-cols-5 gap-2">
                    <script>
                        const cards = [
                            {label: 'A', val: 1}, {label: '2', val: 2}, {label: '3', val: 3}, {label: '4', val: 4}, {label: '5', val: 5},
                            {label: '6', val: 6}, {label: '7', val: 7}, {label: '8', val: 8}, {label: '9', val: 9}, {label: '10/J/Q/K', val: 0}
                        ];
                        cards.forEach(c => {
                            document.write(`
                                <button onclick="inputCard(${c.val})" class="h-16 bg-slate-800 hover:bg-emerald-600 active:scale-95 text-white text-lg font-bold rounded-lg border border-slate-700 transition flex flex-col items-center justify-center">
                                    <span>${c.label}</span>
                                    <span id="card-count-${c.val}" class="text-[10px] text-slate-400 font-normal">剩 ${c.val === 0 ? 128 : 32}</span>
                                </button>
                            `);
                        });
                    </script>
                </div>
            </div>

            <!-- 動態勝率與 EV 展示 -->
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 flex flex-col justify-between space-y-3">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">動態勝率與期望值 (EV)</h2>
                
                <div class="space-y-2">
                    <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-lg border border-slate-800/80">
                        <span class="text-xs font-semibold text-rose-400">莊家 (Banker)</span>
                        <div class="text-right">
                            <div id="prob-b" class="text-xs font-mono text-slate-300">45.86%</div>
                            <div id="ev-b" class="text-[11px] font-mono text-slate-500">EV: -1.06%</div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-lg border border-slate-800/80">
                        <span class="text-xs font-semibold text-blue-400">閒家 (Player)</span>
                        <div class="text-right">
                            <div id="prob-p" class="text-xs font-mono text-slate-300">44.62%</div>
                            <div id="ev-p" class="text-[11px] font-mono text-slate-500">EV: -1.24%</div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-lg border border-slate-800/80">
                        <span class="text-xs font-semibold text-emerald-400">和局 (Tie)</span>
                        <div class="text-right">
                            <div id="prob-t" class="text-xs font-mono text-slate-300">9.52%</div>
                            <div id="ev-t" class="text-[11px] font-mono text-slate-500">EV: -14.36%</div>
                        </div>
                    </div>
                </div>

                <div class="text-[11px] text-slate-500 leading-tight">
                    * 註：正 EV 僅會在牌靴中後段、剩餘點數產生嚴重傾斜時觸發。
                </div>
            </div>

        </div>

        <!-- 歷史出牌序列 -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
            <h2 class="text-xs font-bold text-slate-400 mb-2">已輸入出牌序列：</h2>
            <div id="history-container" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto text-xs font-mono">
                <span class="text-slate-600 italic">尚無資料</span>
            </div>
        </div>

    </div>

    <script>
        const INITIAL_DECK = { 1: 32, 2: 32, 3: 32, 4: 32, 5: 32, 6: 32, 7: 32, 8: 32, 9: 32, 0: 128 };
        let deck = { ...INITIAL_DECK };
        let totalCards = 416;
        let cardHistory = [];

        function inputCard(val) {
            if (deck[val] <= 0) return alert('該點數牌已用盡！');
            deck[val]--;
            totalCards--;
            cardHistory.push(val);
            updateDashboard();
        }

        function undoLastCard() {
            if (cardHistory.length === 0) return;
            const lastVal = cardHistory.pop();
            deck[lastVal]++;
            totalCards++;
            updateDashboard();
        }

        function resetShoe() {
            if (!confirm('確定要洗牌並重置當前牌靴嗎？')) return;
            deck = { ...INITIAL_DECK };
            totalCards = 416;
            cardHistory = [];
            updateDashboard();
        }

        function updateDashboard() {
            document.getElementById('total-cards').innerText = totalCards;
            for (let i = 0; i <= 9; i++) {
                document.getElementById(`card-count-${i}`).innerText = `剩 ${deck[i]}`;
            }

            const histEl = document.getElementById('history-container');
            if (cardHistory.length === 0) {
                histEl.innerHTML = '<span class="text-slate-600 italic">尚無資料</span>';
            } else {
                histEl.innerHTML = cardHistory.map(c => `<span class="px-2 py-0.5 bg-slate-800 border border-slate-700 text-emerald-400 rounded">${c === 0 ? 'K' : c}</span>`).join('');
            }

            calculateProbabilities();
        }

        function calculateProbabilities() {
            if (totalCards < 30) {
                document.getElementById('signal-text').innerText = '牌靴即將結束，建議停止下注';
                return;
            }

            const pLow = (deck[1] + deck[2] + deck[3] + deck[4]) / totalCards;
            const pHigh = (deck[5] + deck[6] + deck[7] + deck[8] + deck[9]) / totalCards;

            const baseProbB = 0.4586 + (pLow - 0.3077) * 0.22 - (pHigh - 0.3846) * 0.08;
            const baseProbP = 0.4462 + (pHigh - 0.3846) * 0.20 - (pLow - 0.3077) * 0.05;
            const baseProbT = 1 - baseProbB - baseProbP;

            const evB = (baseProbB * 0.95) - (1 - baseProbB - baseProbT);
            const evP = (baseProbP * 1.0) - (1 - baseProbP - baseProbT);
            const evT = (baseProbT * 8.0) - (1 - baseProbT);

            document.getElementById('prob-b').innerText = (baseProbB * 100).toFixed(2) + '%';
            document.getElementById('prob-p').innerText = (baseProbP * 100).toFixed(2) + '%';
            document.getElementById('prob-t').innerText = (baseProbT * 100).toFixed(2) + '%';

            updateEVDisplay('ev-b', evB);
            updateEVDisplay('ev-p', evP);
            updateEVDisplay('ev-t', evT);

            const signalBox = document.getElementById('signal-box');
            const signalText = document.getElementById('signal-text');

            if (evB > 0) {
                signalBox.className = "bg-rose-950/80 border border-rose-500 p-4 rounded-xl text-center shadow-lg shadow-rose-950/50";
                signalText.innerHTML = `<span class="text-rose-400 font-extrabold text-lg">🔥 觸發優勢訊號：推薦下注【莊家】(EV: +${(evB * 100).toFixed(2)}%)</span>`;
            } else if (evP > 0) {
                signalBox.className = "bg-blue-950/80 border border-blue-500 p-4 rounded-xl text-center shadow-lg shadow-blue-950/50";
                signalText.innerHTML = `<span class="text-blue-400 font-extrabold text-lg">🔥 觸發優勢訊號：推薦下注【閒家】(EV: +${(evP * 100).toFixed(2)}%)</span>`;
            } else if (evT > 0) {
                signalBox.className = "bg-emerald-950/80 border border-emerald-500 p-4 rounded-xl text-center shadow-lg shadow-emerald-950/50";
                signalText.innerHTML = `<span class="text-emerald-400 font-extrabold text-lg">⚡ 高機率和局警示：推薦觀望或小注【和局】(EV: +${(evT * 100).toFixed(2)}%)</span>`;
            } else {
                signalBox.className = "bg-slate-900 p-4 rounded-xl border border-slate-800 text-center";
                signalText.innerText = `當前無正 EV 下注點，建議觀望或順應路勢`;
            }
        }

        function updateEVDisplay(id, evVal) {
            const el = document.getElementById(id);
            const valStr = (evVal * 100).toFixed(2) + '%';
            if (evVal > 0) {
                el.innerText = `EV: +${valStr}`;
                el.className = "text-[11px] font-mono font-bold text-emerald-400";
            } else {
                el.innerText = `EV: ${valStr}`;
                el.className = "text-[11px] font-mono text-slate-500";
            }
        }

        updateDashboard();
    </script>
</body>
</html>
